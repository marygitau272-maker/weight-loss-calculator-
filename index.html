<!DOCTYPE html>
<html>
<head>
    <title>Weight Loss Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Weight Loss Calculator</h1>

    <label>Current Weight (kg):</label>
    <input type="number" id="currentWeight">

    <label>Target Weight (kg):</label>
    <input type="number" id="targetWeight">

    <label>Height (m):</label>
    <input type="number" step="0.01" id="height">

    <button onclick="calculate()">Calculate</button>

    <div id="result"></div>

    <script>
        function calculate() {
            let currentWeight = parseFloat(document.getElementById("currentWeight").value);
            let targetWeight = parseFloat(document.getElementById("targetWeight").value);
            let height = parseFloat(document.getElementById("height").value);

            let bmi = currentWeight / (height * height);
            let weightDifference = currentWeight - targetWeight;

            let category = "";

            if (bmi < 18.5) {
                category = "Underweight";
            } else if (bmi < 25) {
                category = "Healthy Weight";
            } else if (bmi < 30) {
                category = "Overweight";
            } else {
                category = "Obese";
            }

            document.getElementById("result").innerHTML =
                "BMI: " + bmi.toFixed(1) + "<br>" +
                "Category: " + category + "<br>" +
                "Weight Difference: " + weightDifference.toFixed(1) + " kg";
        }
    </script>

</body>
</html>
